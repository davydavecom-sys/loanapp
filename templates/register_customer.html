{% extends "layout.html" %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-header bg-dark text-white">
        <h4 class="mb-0">Register New Customer</h4>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">First Name</label>
                    <input type="text" name="first_name" class="form-control" placeholder="e.g. John" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Last Name</label>
                    <input type="text" name="last_name" class="form-control" placeholder="e.g. Doe" required>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <div class="input-group">
                    <span class="input-group-text">+254</span>
                    <input type="text" name="phone" class="form-control" placeholder="712345678" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">National ID Number</label>
                <input type="text" name="id_number" class="form-control" placeholder="Enter 8-digit ID" required>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">Save Customer Details</button>
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
