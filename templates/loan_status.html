{% extends "base.html" %}
{% block content %}
    <h2>Loan Status Tracker</h2>
    <div class="table-container" style="margin-top:20px;">
        <table>
            <thead>
                <tr><th>Loan ID</th><th>Customer</th><th>Amount</th><th>Status</th></tr>
            </thead>
            <tbody>
                {% for l in loans %}
                <tr>
                    <td>#{{ l.loan_id }}</td>
                    <td>{{ l.first_name }} {{ l.last_name }}</td>
                    <td>KES {{ l.loan_amount }}</td>
                    <td><span class="status-pill {{ l.loan_status }}">{{ l.loan_status }}</span></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
