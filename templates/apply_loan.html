<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Loan Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-cash-coin me-2 text-success"></i>Loan Origination Portal</span>
            <a href="/dashboard" class="btn btn-sm btn-outline-light"><i class="bi bi-arrow-left me-1"></i>Back to Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="fw-bold text-dark mb-1">New Loan Application</h3>
                        <p class="text-muted small mb-4">Fill out the legal financial data mapping below to save this entry to Supabase.</p>
                        
                        <form action="/loan/issue" method="POST">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-secondary">Customer Database UUID</label>
                                <input type="text" name="customer_id" class="form-control" placeholder="Paste Customer Profile UUID" required>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-secondary">Client First Name</label>
                                    <input type="text" name="first_name" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-secondary">Client Last Name</label>
                                    <input type="text" name="last_name" class="form-control" required>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-secondary">Principal Amount (KES)</label>
                                    <input type="number" step="0.01" name="loan_amount" class="form-control" placeholder="0.00" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-secondary">Interest Charged (KES)</label>
                                    <input type="number" step="0.01" name="loan_interest" class="form-control" placeholder="0.00" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small fw-semibold text-secondary">Initial Processing State</label>
                                <select name="loan_state" class="form-select">
                                    <option value="pending">Pending Review</option>
                                    <option value="granted">Granted (Activates Global Balance)</option>
                                    <option value="rejected">Rejected</option>
                                </select>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg fw-bold"><i class="bi bi-floppy-fill me-2"></i>Save Loan Application</button>
                                <a href="/dashboard" class="btn btn-light text-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
