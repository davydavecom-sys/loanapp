{% extends "base.html" %}
{% block content %}
<div class="form-container" style="max-width: 550px; margin: auto;">
    <h2>New Loan Application</h2>
    <form method="POST">
        <div class="form-group">
            <label>Select Customer</label>
            <select name="customer_id" required>
                <option value="">-- Choose Member --</option>
                {% for c in customers %}
                <option value="{{ c.id }}">{{ c.first_name }} {{ c.last_name }} ({{ c.id_number }})</option>
                {% endfor %}
            </select>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top:15px;">
            <div class="form-group">
                <label>Amount (KES)</label>
                <input type="number" name="amount" required placeholder="e.g. 10000">
            </div>
            <div class="form-group">
                <label>Interest (%)</label>
                <input type="number" step="0.01" name="interest" value="12.00">
            </div>
        </div>
        <div class="form-group" style="margin-top:15px;">
            <label>Repayment Period (Months)</label>
            <input type="number" name="period" required value="6">
        </div>
        <button type="submit" class="btn-submit" style="width:100%; margin-top:25px;">Submit Application</button>
    </form>
</div>
{% endblock %}
